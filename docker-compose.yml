version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mandiri-transport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mandiri_transport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - mandiri_pg_data:/var/lib/postgresql/data

volumes:
  mandiri_pg_data:

