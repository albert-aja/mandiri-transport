server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mandiri-transport-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-not-delete-value: 'null'

app:
  security:
    jwt-secret: ${SUPABASE_JWT_SECRET:mandiri-transport-local-dev-jwt-secret-key-minimum-32-bytes-2026}
    dev-auth-enabled: true
  supabase:
    url: ${SUPABASE_URL:http://localhost:54321}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:operational-media}
  fcm:
    enabled: ${FCM_ENABLED:true}
    project-id: ${FCM_PROJECT_ID:mandiri-transport-ops}
    credentials-path: ${FCM_CREDENTIALS_PATH:./firebase-service-account.json}
    credentials-json: ${FCM_CREDENTIALS_JSON:}
    api-base-url: ${FCM_API_BASE_URL:https://fcm.googleapis.com}
    android-channel-id: mandiri_ops_high_importance
  flight-tracking:
    encryption-key: ${FLIGHT_TRACKING_ENCRYPTION_KEY:mandiri-transport-dev-flight-token-aes256-key-change-in-prod}
    http-timeout-ms: ${FLIGHT_TRACKING_HTTP_TIMEOUT_MS:10000}
    min-poll-interval-seconds: ${FLIGHT_TRACKING_MIN_POLL_INTERVAL_SECONDS:15}
    poll-log-retention-days: ${FLIGHT_TRACKING_POLL_LOG_RETENTION_DAYS:30}
    max-logs-per-credential: ${FLIGHT_TRACKING_MAX_LOGS_PER_CREDENTIAL:200}
    flightaware:
      poll-url: ${FLIGHTAWARE_POLL_URL:https://www.flightaware.com/ajax/trackpoll.rvt}
      allowed-hosts: ${FLIGHTAWARE_ALLOWED_HOSTS:flightaware.com,www.flightaware.com,id.flightaware.com,localhost,127.0.0.1}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/mandiri_transport_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:mandiri_transport_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
app:
  security:
    dev-auth-enabled: true

---
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/mandiri_transport}
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres_dev_password}
app:
  security:
    dev-auth-enabled: false

